# Exemplo para quem já usa Nginx no servidor (em vez do Caddy).
# Copie para /etc/nginx/sites-available/pre-fichas, ajuste o domínio e:
#   ln -s /etc/nginx/sites-available/pre-fichas /etc/nginx/sites-enabled/
#   certbot --nginx -d prefichas.seudominio.com.br     # certificado HTTPS gratuito
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name prefichas.seudominio.com.br;

    client_max_body_size 128k;

    # Compressão (a lista do painel e os arquivos do site ficam 5-10x menores)
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
