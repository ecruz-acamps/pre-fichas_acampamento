# Implantação de UM acampamento em um servidor Linux:
#   banco PostgreSQL + aplicação Node + Caddy (HTTPS automático)
#
#   ./scripts/novo-acampamento.sh      # assistente (gera o .env e sobe tudo)
#   — ou —
#   cp .env.example .env && docker compose up -d --build
#
# Vários acampamentos no mesmo servidor: veja "Vários acampamentos" no README.
name: ${COMPOSE_PROJECT_NAME:-pre-fichas}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prefichas}
      POSTGRES_USER: ${POSTGRES_USER:-prefichas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco NÃO fica exposto para fora do servidor.

  app:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-pre-fichas}-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prefichas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prefichas}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-true}
      PROXIES_CONFIAVEIS: "1"
      SESSAO_HORAS: ${SESSAO_HORAS:-12}
      LIMITE_ENVIOS_POR_HORA: ${LIMITE_ENVIOS_POR_HORA:-30}
      VIACEP_URL: ${VIACEP_URL:-https://viacep.com.br/ws}
      # Identidade aplicada só na primeira inicialização (depois, pelo painel)
      MARCA_INICIAL: ${MARCA_INICIAL:-}
    volumes:
      # Arquivos de marca e logos (marcas/*.json, *.png) ficam acessíveis ao container
      - ./marcas:/app/marcas:ro
    # Porta só no próprio servidor (para um proxy compartilhado, se houver vários acampamentos)
    ports:
      - "127.0.0.1:${PORTA_LOCAL:-3000}:3000"

  # Proxy HTTPS. Ativo quando COMPOSE_PROFILES=caddy (padrão do .env.example).
  # Com vários acampamentos no mesmo servidor, deixe COMPOSE_PROFILES vazio e use
  # um único proxy para todos (deploy/Caddyfile.multi).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
